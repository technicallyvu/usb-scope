<?xml version="1.0" encoding="UTF-8"?>
<!-- Source for art/icon-play-512.png (the 512x512 Play Console listing icon).
     Same geometry as android/src/main/res/drawable/ic_launcher_background.xml and
     ic_launcher_foreground.xml. The adaptive icon only ever shows the central 72x72 of its
     108x108 layers, so the viewBox crops to 18..90: that is what a launcher actually draws,
     scaled to 512. Re-render by loading this file in headless Chrome with the flags
     "headless", "disable-gpu", "window-size=512,512" and "screenshot=art/icon-play-512.png".
     Play wants a full-bleed square; it applies its own corner rounding, so no mask here. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="18 18 72 72">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="108" y2="108">
      <stop offset="0" stop-color="#8BDCC7"/>
      <stop offset="0.5" stop-color="#5FB8D0"/>
      <stop offset="1" stop-color="#4A8FD8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="108" height="108" fill="url(#bg)"/>

  <circle cx="78" cy="41.5" r="12" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="78" cy="41.5" r="9" fill="#FFFFFF" fill-opacity="0.18"/>

  <g fill="none" stroke="#E8F8F5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35.5,78 L33.5,78 C30.7386,78 28.5,75.7614 28.5,73 L28.5,35 C28.5,32.2386 30.7386,30 33.5,30 L53.5,30 C56.2614,30 58.5,32.2386 58.5,35 L58.5,44.3"/>
    <path d="M58.5,57.6 L58.5,73 C58.5,75.7614 56.2614,78 53.5,78 L51.5,78"/>
    <path d="M43.5,72 C43.5,67 43.5,65 44.5,61 C46.44,53.24 52.5,50.5 58.5,50.5 C61.4,50.5 61.4,53.4 64.3,53.4 C66.6,53.4 67.4,52.11 69.52,49.99"/>
  </g>

  <path fill="#E8F8F5" d="M41,72 L46,72 C47.1046,72 48,72.8954 48,74 L48,80 C48,81.1046 47.1046,82 46,82 L41,82 C39.8954,82 39,81.1046 39,80 L39,74 C39,72.8954 39.8954,72 41,72 Z"/>
  <path fill="#E8F8F5" d="M42,82.8 L45,82.8 C45.5523,82.8 46,83.2477 46,83.8 L46,85.3 C46,85.8523 45.5523,86.3 45,86.3 L42,86.3 C41.4477,86.3 41,85.8523 41,85.3 L41,83.8 C41,83.2477 41.4477,82.8 42,82.8 Z"/>

  <path fill="#E8F8F5" d="M67.93,48.4 L71.11,51.58 L76.94,44.69 L74.82,42.57 Z"/>

  <circle cx="78" cy="41.5" r="5.5" fill="#E8F8F5"/>
  <circle cx="78" cy="41.5" r="3.2" fill="none" stroke="#C8ECEC" stroke-width="1.2"/>
  <ellipse cx="76.15" cy="39.6" rx="1.7" ry="1.2" fill="#FFFFFF"/>
</svg>
