<?xml version="1.0" encoding="UTF-8"?>
<!-- Source for art/icon-play-512.png (the 512x512 Play Console listing icon).
     Same geometry as android/src/main/res/drawable/ic_launcher_background.xml and
     ic_launcher_foreground.xml. The adaptive icon only ever shows the central 72x72 of its
     108x108 layers, so the viewBox crops to 18..90: that is what a launcher actually draws,
     scaled to 512. Re-render by loading this file in headless Chrome with the flags
     "headless", "disable-gpu", "window-size=512,512" and "screenshot=art/icon-play-512.png".
     Play wants a full-bleed square; it applies its own corner rounding, so no mask here. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="18 18 72 72">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="108" y2="108">
      <stop offset="0" stop-color="#8BDCC7"/>
      <stop offset="0.5" stop-color="#5FB8D0"/>
      <stop offset="1" stop-color="#4A8FD8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="108" height="108" fill="url(#bg)"/>

  <circle cx="75.7" cy="35.1" r="9.2" fill="#FFFFFF" fill-opacity="0.102"/>
  <circle cx="75.7" cy="35.1" r="7" fill="#FFFFFF" fill-opacity="0.149"/>

  <g fill="none" stroke="#E8F8F5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M37.3,78 L32,78 C29.79,78 28,76.21 28,74 L28,33 C28,30.79 29.79,29 32,29 L54,29 C56.21,29 58,30.79 58,33 L58,41.5"/>
    <path d="M58,56 L58,74 C58,76.21 56.21,78 54,78 L52.7,78"/>
    <path d="M45,69 C45,62 42,56 45.5,52 C49,48 53.5,47.2 58.5,48.6 C62,53.5 63.5,57 67,55.5 C69.5,54.4 68.1,49.43 69.6,46.6"/>
  </g>

  <path fill="#E8F8F5" d="M42.3,69 L47.7,69 C48.69,69 49.5,69.81 49.5,70.8 L49.5,78.2 C49.5,79.19 48.69,80 47.7,80 L42.3,80 C41.31,80 40.5,79.19 40.5,78.2 L40.5,70.8 C40.5,69.81 41.31,69 42.3,69 Z"/>
  <path fill="#E8F8F5" d="M43.7,80.8 L46.3,80.8 C46.96,80.8 47.5,81.34 47.5,82 L47.5,83.4 C47.5,84.06 46.96,84.6 46.3,84.6 L43.7,84.6 C43.04,84.6 42.5,84.06 42.5,83.4 L42.5,82 C42.5,81.34 43.04,80.8 43.7,80.8 Z"/>

  <path fill="#E8F8F5" stroke="#E8F8F5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"
        d="M68.28,45.9 L70.92,47.3 L77.75,38.47 L71.75,35.29 Z"/>

  <circle cx="75.7" cy="35.1" r="5.5" fill="#E8F8F5"/>
  <circle cx="75.7" cy="35.1" r="3.1" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.4"/>
  <ellipse cx="73.8" cy="33.2" rx="1.8" ry="1.3" fill="#FFFFFF"/>
</svg>
